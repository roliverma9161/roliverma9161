<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="50%" stop-color="#1E3A8A"/>
<stop offset="100%" stop-color="#0EA5E9"/>
</linearGradient>

<linearGradient id="text" x1="0" y1="0" x2="800" y2="0">
<stop offset="0%" stop-color="#38BDF8"/>
<stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8"/>
</filter>

</defs>

<!-- Background -->
<rect width="1280" height="400" fill="url(#bg)"/>

<!-- Decorative Circles -->
<circle cx="150" cy="70" r="120" fill="#38BDF8" opacity="0.08"/>
<circle cx="1120" cy="320" r="180" fill="#FFFFFF" opacity="0.05"/>
<circle cx="980" cy="60" r="60" fill="#38BDF8" opacity="0.15"/>

<!-- Grid -->
<g opacity="0.08">
<path d="M0 50H1280M0 100H1280M0 150H1280M0 200H1280M0 250H1280M0 300H1280M0 350H1280"
stroke="white"/>

<path d="M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400M600 0V400M700 0V400M800 0V400M900 0V400M1000 0V400M1100 0V400M1200 0V400"
stroke="white"/>
</g>

<!-- Code Brackets -->
<text x="70" y="215"
font-size="120"
font-family="JetBrains Mono"
fill="#38BDF8"
opacity="0.15">
&lt;/&gt;
</text>

<!-- Main Heading -->
<text
x="640"
y="145"
text-anchor="middle"
font-size="60"
font-family="Poppins,Segoe UI,sans-serif"
font-weight="700"
fill="url(#text)"
filter="url(#shadow)">
Roli Verma
</text>

<!-- Subtitle -->
<text
x="640"
y="195"
text-anchor="middle"
font-size="26"
font-family="JetBrains Mono"
fill="#E2E8F0">
Full Stack Web Developer
</text>

<!-- Tech Stack -->
<text
x="640"
y="235"
text-anchor="middle"
font-size="18"
font-family="JetBrains Mono"
fill="#94A3B8">
HTML • CSS • JavaScript • React • Next.js • Node.js • Express • MongoDB
</text>

<!-- Bottom Line -->
<line
x1="300"
y1="275"
x2="980"
y2="275"
stroke="#38BDF8"
stroke-width="2"
opacity="0.5"/>

<!-- Quote -->
<text
x="640"
y="325"
text-anchor="middle"
font-size="22"
font-family="JetBrains Mono"
fill="#38BDF8">
Code • Learn • Build • Repeat 🚀
</text>

</svg>
